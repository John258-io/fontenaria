spring.application.name=fontenaria-backend
server.port=8080



# --- PostgreSQL (produção): comente as 3 linhas acima e use estas ---
# Crie primeiro a base de dados (o nome tem hífen, por isso entre aspas):
#   psql -U postgres -c 'CREATE DATABASE "fontenaria-db";'
 spring.datasource.url=jdbc:postgresql://localhost:5432/fontenaria_db
 spring.datasource.username=postgres
 spring.datasource.password=868724

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT (autenticação da API) ---
# Segredo de assinatura dos tokens: mínimo 32 caracteres. Troque em produção!
app.jwt.secret=fontenaria-manhica-dev-secret-trocar-em-producao-0123456789
app.jwt.expiracao-minutos=480

# --- CORS: origens do frontend autorizadas a aceder à API ---
# "*" permite qualquer origem (ex.: o Live Server em http://127.0.0.1:5501).
# Em produção, substitua pela URL exacta do frontend, ex.: https://app.fontanaria.co.mz
app.cors.allowed-origins=*
